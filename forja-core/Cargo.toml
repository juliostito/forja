[package]
name = "forja-core"
version = "0.1.0"
edition = "2021"
description = "Forja domain core: plan, progression, streaks, back safety, nutrition, XP, SQLite storage"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"

[dev-dependencies]
proptest = "1"
