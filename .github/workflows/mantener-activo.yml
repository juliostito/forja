name: Mantener avisos activos
# GitHub pausa los workflows programados tras 60 días sin actividad en el repositorio. Esto hace un commit vacío una vez al mes.
on:
  schedule:
    - cron: "17 15 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "forja-bot"
          git config user.email "forja-bot@users.noreply.github.com"
          git commit --allow-empty -m "Mantener avisos activos"
          git push
