<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one column "cuaderno de entrenamiento" — status band, then tab panes; bottom tab bar on phones. */
:root{
  --bg:#eef0f3; --surface:#ffffff; --sunk:#e3e7ec; --line:#cfd5dd;
  --ink:#141820; --muted:#5a6473;
  --accent:#1f4fd8; --accent-ink:#ffffff; --accent-soft:#dfe7fb;
  --ok:#1d7a45; --ok-soft:#dcf1e4; --warn:#a8580a; --warn-soft:#fbecd9; --bad:#c0262d; --bad-soft:#fbe1e2;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1217; --surface:#171b22; --sunk:#1f242d; --line:#2c333e;
  --ink:#e8ecf2; --muted:#98a2b3;
  --accent:#7d9cff; --accent-ink:#0b1020; --accent-soft:#1d2848;
  --ok:#5fd08f; --ok-soft:#15301f; --warn:#f0a548; --warn-soft:#35260f; --bad:#ff6b70; --bad-soft:#3a1517; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1217; --surface:#171b22; --sunk:#1f242d; --line:#2c333e;
  --ink:#e8ecf2; --muted:#98a2b3;
  --accent:#7d9cff; --accent-ink:#0b1020; --accent-soft:#1d2848;
  --ok:#5fd08f; --ok-soft:#15301f; --warn:#f0a548; --warn-soft:#35260f; --bad:#ff6b70; --bad-soft:#3a1517; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:2.1rem;font-weight:800;text-transform:uppercase}
h2{font-size:1.6rem;font-weight:700;text-transform:uppercase}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{font-family:var(--f-display);font-size:1.35rem;text-transform:uppercase;letter-spacing:.04em;padding:14px 18px;width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
input[type=number],input[type=text],input[type=date],textarea,select{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}

/* top band */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .label{color:var(--accent)}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.meter b{font-family:var(--f-display);font-size:1.9rem;line-height:1}
.week{display:flex;gap:6px}
.dot{flex:1;min-width:0;border-radius:6px;padding:6px 0;text-align:center;font-size:.75rem;font-weight:700;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.dot.train{border-style:dashed}
.dot.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.dot.miss{background:var(--bad);color:#fff;border-color:var(--bad)}
.dot.today{outline:2px solid var(--accent);outline-offset:1px}

/* alerts */
.alert{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:1px solid}
.alert.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.alert.bad strong{color:var(--bad)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert.warn strong{color:var(--warn)}
.alert.ok{background:var(--ok-soft);border-color:var(--ok)}
.alert.ok strong{color:var(--ok)}
.alert.info{background:var(--accent-soft);border-color:var(--accent)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.alert.bad.pulse{animation:pulse 1.8s infinite}
@media (prefers-reduced-motion:reduce){.alert.bad.pulse{animation:none}}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{display:flex;gap:4px;max-width:760px;width:100%}
.tab{flex:1;min-width:0;border:0;background:transparent;border-radius:8px;padding:8px 2px;font-size:.78rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:22px;height:22px}
.tab[aria-selected=true]{color:var(--accent);background:var(--accent-soft)}

/* session */
.sess-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.ex{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.ex.complete{border-color:var(--ok)}
.ex-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex-name{font-weight:700}
.target{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);white-space:nowrap}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 44px;gap:6px;align-items:center}
.set.nokg{grid-template-columns:28px minmax(0,1fr) 44px}
.set .n{font-family:var(--f-mono);color:var(--muted);font-size:.8rem;text-align:center}
.tick{width:44px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-weight:800}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
details{border-top:1px dashed var(--line);padding-top:6px}
summary{cursor:pointer;font-size:.85rem;color:var(--accent);font-weight:600}
.cues{font-size:.87rem;display:flex;flex-direction:column;gap:4px;margin-top:6px}
.cues .back{color:var(--warn)}
.hint{font-size:.82rem;background:var(--accent-soft);border-radius:6px;padding:6px 8px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:22px;height:22px;flex:none;accent-color:var(--ok);margin-top:1px}
.restbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 16px;display:flex;gap:12px;align-items:center;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.restbar button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:999px;padding:4px 10px;font-size:.8rem}
.slider{width:100%}

/* plan tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td.num{white-space:nowrap}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.7rem;line-height:1.05}
@media (max-width:520px){.grid2{grid-template-columns:minmax(0,1fr)} h1{font-size:1.8rem}}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 12px;border-radius:10px;max-width:92%;white-space:pre-wrap;font-size:.93rem}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.coach{align-self:flex-start;background:var(--sunk)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:.82rem}
svg.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
canvas.demo{width:100%;max-width:260px;aspect-ratio:8/5;border-radius:8px;display:block;align-self:center;height:auto}
canvas.demo.sm{width:112px;max-width:112px;flex:none}
.rout{display:flex;flex-direction:column}
.ri{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.ri:last-child{border-bottom:0}
.ri-body{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.ri-top{display:flex;gap:8px;align-items:flex-start}
.ri-top input{width:22px;height:22px;flex:none;accent-color:var(--ok)}
.tbtn{align-self:flex-start;padding:6px 10px}
.restbar span#restLbl{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
a.yt{color:var(--accent);font-weight:600}
input,textarea,select{font-size:16px!important}
html{-webkit-text-size-adjust:100%}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.dlist{display:flex;flex-direction:column}
details.dl{border-top:1px solid var(--line);padding:0}
details.dl:last-child{border-bottom:1px solid var(--line)}
details.dl summary{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 2px;color:var(--ink);font-weight:600;font-size:.95rem;list-style:none}
details.dl summary::-webkit-details-marker{display:none}
details.dl summary::after{content:"▸";color:var(--accent);flex:none;transition:transform .15s}
details.dl[open] summary::after{transform:rotate(90deg)}
.dl-n{flex:1;min-width:0}
.dl-body{display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:90vw}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.toast{top:calc(12px + env(safe-area-inset-top,0px))}
.prot{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:8px;background:var(--sunk)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.photos figure{margin:0;display:flex;flex-direction:column;gap:4px}.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--sunk)}
.photos figcaption{display:flex;justify-content:space-between;align-items:center}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.medal{border:1px dashed var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px;opacity:.55}
.medal.on{opacity:1;border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.m-ico{font-size:1.3rem;color:var(--warn)}
pre.sum{white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:10px;margin:0;font-family:var(--f-mono);font-size:.82rem}
details.topic{border-top:1px solid var(--line);padding:10px 0}
details.topic summary{font-size:.95rem}
textarea#subTxt{min-height:90px}
.health{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:8px;background:var(--sunk)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.hs{display:flex;flex-direction:column;background:var(--surface);border-radius:6px;padding:6px 8px}.hs b{font-family:var(--f-display);font-size:1.4rem;line-height:1.1}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <span class="label">Entrenador personal · Upper / Lower 4×</span>
      <h1>Forja 4×</h1>
    </div>
    <span class="small muted" id="syncState">Cargando…</span>
  </header>

  <section class="meters" aria-label="Resumen">
    <div class="meter"><span class="label">Racha</span><b class="num" id="mStreak">0</b><span class="small muted">sesiones seguidas</span></div>
    <div class="meter"><span class="label">Semana</span><b class="num" id="mWeek">0/4</b><span class="small muted">sesiones</span></div>
    <div class="meter"><span class="label">Peso</span><b class="num" id="mWeight">104</b><span class="small muted" id="mWeightSub">kg · inicio</span></div>
  </section>
  <div class="week" id="weekDots" aria-label="Semana actual"></div>

  <main id="pane"></main>
</div>

<nav class="tabs" aria-label="Secciones"><div class="tabs-in" role="tablist" id="tabs"></div></nav>
<div class="restbar" id="restbar" hidden><span><span id="restLbl">Descanso</span> <span class="num" id="restT">90</span>s</span><button id="restSkip">Saltar</button></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ============ DATOS DEL PLAN ============ */
const PROFILE_DEFAULT = { age:30, sex:"m", height:173, startWeight:104, startDate:null, why:"", penalty:"", signedAt:null, trainTime:"07:00" };
const DOW_NAMES = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const SCHEDULE = {1:"UA",2:"LA",4:"UB",5:"LB"}; // lunes, martes, jueves, viernes

const EX = {
  inc_pu:{n:"Flexiones inclinadas (manos en la banca)",lo:8,hi:15,sets:3,u:"bw",cue:"Cuerpo recto de talón a cabeza. Baja el pecho hasta el borde de la banca en 2–3 s, empuja fuerte.",back:"Aprieta glúteos y abdomen: si la cadera se hunde, sube las manos (mesa o pared).",prog:"3×15 limpias → baja la inclinación: banca → escalón → suelo con rodillas → suelo."},
  row1:{n:"Remo a una mano apoyado en la banca",lo:10,hi:15,sets:3,u:"kg",side:true,start:7,cue:"Codo hacia el bolsillo trasero, aprieta la escápula 1 s arriba.",back:"Mano y rodilla sobre la banca, espalda plana como mesa; no gires el tronco.",prog:"Top de reps en las 3 series → +1,25 kg."},
  press:{n:"Press con mancuernas en banca",lo:10,hi:20,sets:3,u:"kg",start:7,tempo:"3-1-1",cue:"Baja en 3 s, pausa 1 s abajo, sube. Hombros pegados a la banca.",back:"Pies firmes en el suelo, sin arquear exagerado la zona lumbar.",prog:"Con poco peso, gana con tempo lento y reps altas; 3×20 → +1,25 kg."},
  lat:{n:"Elevaciones laterales",lo:12,hi:20,sets:2,u:"kg",start:2,cue:"Sube hasta la altura del hombro, codos levemente flexionados, baja lento.",back:"De pie con rodillas blandas o sentado en la banca.",prog:"Suma reps antes que peso."},
  curl:{n:"Curl de bíceps",lo:10,hi:15,sets:2,u:"kg",start:5,cue:"Codos quietos al costado, baja en 3 s.",back:"Sin balancear el tronco: si necesitas impulso, baja peso.",prog:"2×15 → +1,25 kg."},
  skull:{n:"Extensión de tríceps acostado en banca",lo:10,hi:15,sets:2,u:"kg",start:4,cue:"Una mancuerna con ambas manos, codos apuntando al techo, baja detrás de la cabeza.",back:"Acostado la espalda queda protegida.",prog:"2×15 → +1,25 kg."},
  deadbug:{n:"Dead bug",lo:6,hi:10,sets:2,u:"bw",side:true,cue:"Zona lumbar pegada al suelo, extiende brazo y pierna contrarios lento, exhala.",back:"Si la lumbar se despega, acorta el rango.",prog:"Pausa de 3 s extendido."},
  floor:{n:"Floor press con pausa (press en el suelo)",lo:10,hi:15,sets:3,u:"kg",start:8,tempo:"2-2-1",cue:"Codos tocan el suelo, pausa de 2 s, empuja.",back:"Rodillas dobladas, pies apoyados.",prog:"3×15 → +1,25 kg."},
  csrow:{n:"Remo con pecho apoyado (boca abajo en la banca)",lo:10,hi:15,sets:3,u:"kg",start:7,cue:"Pecho sobre la banca, tira ambas mancuernas, pausa 1 s arriba.",back:"El pecho apoyado descarga 100% la espalda baja: es tu remo más seguro.",prog:"3×15 → +1,25 kg."},
  ohp:{n:"Press de hombros sentado (espalda contra la pared)",lo:8,hi:12,sets:3,u:"kg",start:5,cue:"Banca contra la pared, espalda apoyada, sube sin arquear.",back:"Costillas abajo; si arqueas la lumbar, baja el peso.",prog:"3×12 → +1,25 kg."},
  pullover:{n:"Pullover con mancuerna en banca",lo:12,hi:15,sets:2,u:"kg",start:6,cue:"Brazos casi extendidos, baja detrás de la cabeza hasta sentir estiramiento.",back:"Abdomen apretado, no dejes que las costillas se abran.",prog:"2×15 → +1,25 kg."},
  rear:{n:"Pájaros (deltoide posterior) con pecho apoyado",lo:15,hi:20,sets:2,u:"kg",start:2,cue:"Boca abajo en la banca, abre los brazos como alas, pausa arriba.",back:"Pecho apoyado = cero carga lumbar.",prog:"Suma reps; luego +1,25 kg."},
  hammer:{n:"Curl martillo",lo:10,hi:15,sets:2,u:"kg",start:6,cue:"Palmas mirándose, codos quietos.",back:"Sin balanceo.",prog:"2×15 → +1,25 kg."},
  dpu:{n:"Flexiones cerradas inclinadas",lo:8,hi:15,sets:2,u:"bw",cue:"Manos juntas en la banca, codos pegados al cuerpo.",back:"Igual que las flexiones: tabla firme.",prog:"Baja la inclinación al llegar a 2×15."},
  boxsq:{n:"Sentadilla goblet a la banca",lo:10,hi:15,sets:3,u:"kg",start:9,tempo:"3-1-1",cue:"Mancuerna al pecho, baja en 3 s hasta rozar la banca, pausa sin soltarte, sube.",back:"Pecho alto, peso en todo el pie. La banca marca una profundidad segura.",prog:"3×15 → +1,25 kg o banca más baja (pon un cojín y luego quítalo)."},
  rdl:{n:"Peso muerto rumano con mancuernas",lo:10,hi:15,sets:3,u:"kg",start:8,cue:"Empuja la cadera hacia atrás, mancuernas rozando los muslos, rodillas blandas.",back:"Columna neutra SIEMPRE. Baja solo hasta sentir los isquios; si duele la lumbar, cámbialo por hip thrust ese día.",prog:"3×15 → +1,25 kg por mancuerna."},

/* ============ LÓGICA DE ENTRENADOR ============ */
function isTrainDay(dateStr){return !!SCHEDULE[parse(dateStr).getDay()]}
function doneOn(dateStr){
  const l=S.logs[dateStr]; if(l&&l.done&&SCHEDULE[parse(dateStr).getDay()]) return true;
  return Object.values(S.logs).some(x=>x.done&&x.makeupFor===dateStr);
}
function startDate(){return S.profile.startDate||today()}
function streak(){
  let n=0,d=new Date(); const st=startDate();
  for(let i=0;i<400;i++){
    const s=iso(d); if(s<st) break;
    if(isTrainDay(s)){ if(doneOn(s)) n++; else if(s!==today()) break; }
    d=addDays(d,-1);
  }
  return n;
}
function weekStart(d=new Date()){const x=new Date(d);const k=(x.getDay()+6)%7;return addDays(x,-k)}
function weekCount(){let n=0;const ws=weekStart();for(let i=0;i<7;i++){const s=iso(addDays(ws,i));if(isTrainDay(s)&&doneOn(s))n++}
  return n}
function lastMissed(){ // el último día de entrenamiento pasado que se perdió (y no se recuperó), dentro de 3 días
  let d=addDays(new Date(),-1);
  for(let i=0;i<3;i++){const s=iso(d); if(s<startDate()) return null; if(isTrainDay(s)) return doneOn(s)?null:s; d=addDays(d,-1)}
  return null;
}
function latestWeight(){const ks=Object.keys(S.weights).sort();return ks.length? S.weights[ks[ks.length-1]].kg : S.profile.startWeight}
function weeksIn(){return Math.max(0,Math.floor((parse(today())-parse(startDate()))/(7*864e5)))}
function stepsGoal(){return Math.min(10000,6000+1000*Math.floor(weeksIn()/2))}
function targets(){
  const w=latestWeight(),p=S.profile;
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==="f"?-161:5);
  const tdee=bmr*1.45;
  const kcal=Math.round((tdee-600)/50)*50;
  const prot=Math.round(2*(p.height-100)/5)*5; // ~2 g por kg de peso meta aproximado
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,prot,fat:Math.round(kcal*0.28/9),carbs:Math.round((kcal-prot*4-kcal*0.28)/4),water:(w*0.033).toFixed(1),fiber:30};
}
function lastPerf(exId,beforeDate){
  const ds=Object.keys(S.logs).filter(d=>d<beforeDate&&S.logs[d].sets&&S.logs[d].sets[exId]).sort();
  if(!ds.length) return null; return S.logs[ds[ds.length-1]].sets[exId];
}
function suggestion(exId,dateStr){
  const e=EX[exId], last=lastPerf(exId,dateStr);
  if(!last) return {kg:e.start||0,txt:e.u==="kg"?`Primera vez: empieza con ~${e.start} kg y deja 2–3 reps en reserva.`:"Primera vez: deja 2–3 reps en reserva."};
  const done=last.filter(s=>s&&s.ok);
  const kg=Math.max(...done.map(s=>+s.kg||0),0)||e.start||0;
  const allTop=done.length>=nS(e)&&done.every(s=>(+s.r||0)>=e.hi);
  if(allTop&&e.u==="kg"&&kg+1.25>capKg(exId)) return {kg,txt:"Llegaste al tope de tus discos. Progresa así: baja en 4 s, pausa 2 s abajo y haz reps 1½. En la Fase 2 la app te pasa a la variante más difícil."};
  if(allTop){ return e.u==="kg"?{kg:+(kg+1.25).toFixed(2),txt:`¡Subes! Hiciste el máximo la vez pasada → ${(kg+1.25).toFixed(2).replace(/\.?0+$/,"")} kg.`}:{kg:0,txt:"¡Dominado! Pasa a la versión más difícil: "+e.prog}; }
  const best=Math.max(...done.map(s=>+s.r||0),0);
  return {kg,txt:`La vez pasada: ${done.map(s=>s.r).join("/")} reps${e.u==="kg"?" con "+kg+" kg":""}. Meta: +1 rep en al menos una serie.`};
}

async function shrink(file){
  const bmp=await createImageBitmap(file);const m=1080/Math.max(bmp.width,bmp.height),sc=Math.min(1,m);
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
}

  const best=Math.max(S.profile.bestStreak||0,streak()), lost=S.profile.startWeight-latestWeight();
  const lvl=Object.keys(EX).some(id=>{let prev=null;for(const d of Object.keys(S.logs).sort()){const r=(S.logs[d].sets||{})[id];if(!r)continue;const m=Math.max(0,...r.filter(s=>s&&s.ok).map(s=>+s.kg||0));if(!m)continue;if(prev!==null&&m>prev)return true;prev=Math.max(prev||0,m)}return false});

function checkMedals(announce){
  const st=streak(); if(st>(S.profile.bestStreak||0)) S.profile.bestStreak=st;

  if(!fresh.length) return;
  S.profile.medals=[...seen,...fresh.map(m=>m[0])];
  if(announce) setTimeout(()=>toast("🏅 Nueva medalla: "+fresh.map(m=>m[1]).join(", ")),400);
}

function weeklyReview(){
  const end=new Date(),days=[...Array(7)].map((_,i)=>iso(addDays(end,-i))).reverse();
  const planned=days.filter(isTrainDay).filter(d=>d>=startDate()&&d<=today()), done=planned.filter(doneOn).length;
  const missed=planned.filter(d=>!doneOn(d)&&d<today());
  const reasons=missed.map(d=>S.logs[d]&&S.logs[d].reason).filter(Boolean);
  const pains=days.map(d=>S.logs[d]&&S.logs[d].pain).filter(v=>v!=null), avgPain=pains.length?(pains.reduce((a,b)=>a+b,0)/pains.length):null;
  const hab=days.map(d=>{const h=(S.days[d]||{}).h||{};return Object.values(h).filter(Boolean).length}), habPct=Math.round(hab.reduce((a,b)=>a+b,0)/(7*7)*100);
  const protDays=days.filter(d=>(S.days[d]||{}).pg>=targets().prot).length;
  const ws=Object.keys(S.weights).sort(), avg=(from,to)=>{const v=ws.filter(k=>k>=from&&k<=to).map(k=>+S.weights[k].kg);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
  const a1=avg(iso(addDays(end,-6)),today()),a0=avg(iso(addDays(end,-13)),iso(addDays(end,-7)));
  const lines=[];
  lines.push(`Sesiones: ${done} de ${planned.length} planificadas hasta hoy.`+(missed.length?` Faltaste ${missed.length}${reasons.length?" (motivos: "+reasons.map(r=>"“"+r+"”").join(", ")+")":""}.`:" Ninguna falta. Así se hace."));
  if(avgPain!=null) lines.push(`Dolor lumbar promedio: ${avgPain.toFixed(1)}/10.`+(avgPain>3?" Está alto: cambia los ejercicios que molestan (ver “Me molesta la espalda”) y consulta si no baja.":" Bajo control."));
  const st=days.map(d=>((S.days[d]||{}).health||{}).steps).filter(v=>v!=null);
  if(st.length) lines.push(`Pasos (Apple Salud): promedio ${Math.round(st.reduce((a,b)=>a+b,0)/st.length).toLocaleString("es-CL")} al día en ${st.length} días registrados; meta ${stepsGoal().toLocaleString("es-CL")}.`);
  lines.push(`Hábitos diarios: ${habPct}% cumplidos. Proteína completa ${protDays} de 7 días.`);
  if(a1!=null&&a0!=null){const dlt=a1-a0;lines.push(`Peso promedio: ${a1.toFixed(1)} kg (${dlt>0?"+":""}${dlt.toFixed(1)} kg vs semana anterior).`+(dlt>-0.2?" Si se repite otra semana, quita ~150 kcal al día.":" Buen ritmo."))}
  else lines.push("Pésate al menos 2 veces por semana para ver la tendencia.");
  let focus;
  if(planned.length&&done<planned.length) focus="Tu foco: no fallar dos veces. Deja la ropa y las mancuernas listas la noche anterior y, si el día se complica, haz la versión mínima de 15 min.";
  else if(protDays<4) focus=`Tu foco: proteína. Usa los botones de “Hoy” y apunta a ${targets().prot} g; agrega huevos al desayuno y una lata de atún o jurel en la cena.`;
  else if(habPct<60) focus=`Tu foco: pasos. Meta ${stepsGoal().toLocaleString("es-CL")} al día: una caminata de 20 min después de almuerzo te deja casi allí.`;
  else focus="Tu foco: sube un poco la exigencia. Termina cada serie a 1 rep del fallo y respeta los descansos de 90 s.";
  lines.push(focus);
  return lines;
}

// El atajo "Forja Salud" copia un texto como: FORJA;pasos=8123;kcal=512;ejercicio=34;fcr=62;peso=103,2;sueno=7,1
function hnum(v,int){if(v==null)return null;let x=String(v).replace(/[^0-9.,]/g,"");if(!x)return null;
  if(x.includes(",")&&x.includes(".")) x=x.replace(/\./g,"").replace(",",".");
  else if(x.includes(",")) x=x.replace(",",".");
  else if(int&&/^\d{1,3}(\.\d{3})+$/.test(x)) x=x.replace(/\./g,"");
  const n=parseFloat(x);return isFinite(n)?(int?Math.round(n):Math.round(n*10)/10):null}
function parseHealth(txt){
  if(!/FORJA/i.test(txt||"")) return null;
  const kv={};String(txt).split(/[;\n|]/).forEach(p=>{const m=p.match(/^\s*([a-záéíóúñ]+)\s*[=:]\s*(.+)$/i);if(m)kv[m[1].toLowerCase()]=m[2]});
  const h={steps:hnum(kv.pasos,1),kcal:hnum(kv.kcal,1),exMin:hnum(kv.ejercicio,1),rhr:hnum(kv.fcr,1),weight:hnum(kv.peso),sleep:hnum(kv.sueno??kv["sueño"])};
  return Object.values(h).some(v=>v!=null)?h:null;
}

}

    }
    h+=`<section class="card"><div class="sess-head"><div class="stack" style="gap:4px"><span class="label">Hoy · ${DOW_NAMES[dow]}</span><h2>${s.name}</h2><span class="muted small">${s.sub} · ~${s.min} min</span></div>
      ${log&&log.done?'<span class="tag ok">Hecho</span>':'<span class="tag">Pendiente</span>'}</div>
      <p class="small muted">Toca cada ejercicio para ver cómo se hace.</p>
      ${exListHTML(type)}
      ${log&&log.done?`<button class="btn" data-start="${type}">Ver / editar registro</button>`:`<button class="btn primary big" data-start="${type}">Empezar ${s.name}</button>

      <div id="skipBox" hidden class="stack">

        <label class="stack small"><span class="label">Escribe la razón real (mínimo 25 letras)</span><textarea id="skipReason" placeholder="Si te da flojera escribirlo, te da menos flojera hacer la versión de 15 min."></textarea></label>
        <div class="row"><button class="btn primary" data-start="MIN">Mejor hago la mínima</button><button class="btn danger" id="skipConfirm" disabled>Confirmar que fallo hoy</button></div>
      </div>
    </section>
    <section class="card"><span class="label">Antes de empezar · 8–10 min</span><h3>Calentamiento de hoy</h3><p class="small muted">Específico para ${s.name}. Toca cada uno para ver la demostración.</p>${demoListHTML(ROUT[type].w)}</section>
    <section class="card"><span class="label">Al terminar · 6–8 min</span><h3>Estiramientos de hoy</h3><p class="small muted">Suave, 6 de 10 de intensidad, sin rebotes.</p>${demoListHTML(ROUT[type].s)}</section>`;
  } else {
    const wk = dow===0;
    h+=`<section class="card"><span class="label">Hoy · ${DOW_NAMES[dow]} · Descanso activo</span><h2>${wk?"Domingo de revisión":"Día de caminar"}</h2>
      <p class="small">El descanso no es sofá: tus músculos se recuperan mejor moviéndote suave. ${wk?"Pésate en ayunas, revisa tu semana y prepara comidas.":"Camina 30–45 min a ritmo de conversación."}</p>
      ${wk?`<div class="row"><input type="number" step="0.1" inputmode="decimal" id="wIn" placeholder="Peso en ayunas (kg)" style="max-width:220px"><button class="btn primary" id="wSave">Guardar peso</button></div>`:""}
    </section>
    <section class="card"><span class="label">Movilidad de descanso · 10 min</span><h3>Espalda feliz</h3>${routineHTML([...ROUT.REST.w,...ROUT.REST.s],"mob",S.days[t]||{})}</section>`;
  }
  h+=habitsCard(t);
  return h;
}

function habitsCard(t){
  const tg=targets(), day=S.days[t]||{}, hb=day.h||{};
  const items=[
    ["steps",`Pasos: ${stepsGoal().toLocaleString("es-CL")} o más`],
    ["prot",`Proteína: ~${tg.prot} g (una palma de proteína en cada comida)`],
    ["water",`Agua: ${tg.water.replace(".",",")} L`],
    ["veg","Verduras en almuerzo y cena (½ plato)"],
    ["nosugar","Cero bebidas azucaradas ni alcohol"],
    ["mcgill","Big 3 de McGill (5 min, protege tu espalda)"],
    ["sleep","Dormir 7+ h (pantallas fuera 30 min antes)"]
  ];
  const n=items.filter(([k])=>hb[k]).length;
  return `<section class="card"><div class="sess-head"><div><span class="label">Hábitos diarios</span><h3>Lo que pasa fuera del entrenamiento decide el 80% del resultado</h3></div><span class="tag ${n===items.length?"ok":""} num">${n}/${items.length}</span></div>
  ${healthBlock(t)}${proteinBlock(t)}<div>${items.map(([k,l])=>`<label class="check"><input type="checkbox" data-habit="${k}" ${hb[k]?"checked":""}><span>${esc(l)}</span></label>`).join("")}</div></section>`;
}

  ${["UA","LA","UB","LB"].map(k=>`<section class="card"><span class="label">${SESSIONS[k].sub}</span><h3>${SESSIONS[k].name}</h3><div class="tbl-wrap"><table><thead><tr><th>Ejercicio</th><th>Series×reps</th><th>Carga inicial</th></tr></thead><tbody>${rows(k)}</tbody></table></div></section>`).join("")}
  <section class="card"><span class="label">Cómo progresar con mancuernas livianas</span><h3>Doble progresión</h3>
  <ul class="clean small">
    <li><b>Reps primero, peso después.</b> Trabaja en el rango (ej. 10–15). Cuando completas <i>todas</i> las series en el tope con buena técnica, sube 1,25 kg (tu disco más chico). La app te lo dice sola.</li>

    <li><b>Cuando el peso se acabe:</b> tempo más lento (3–4 s bajando), pausas, repeticiones "1½", versiones a una pierna/un brazo, menos descanso.</li>

    <li><b>Descanso entre series:</b> 60–90 s. Mantén ese ritmo: la app inicia el cronómetro al marcar cada serie.</li>

function viewProgreso(){

  const prs=Object.keys(EX).filter(id=>!id.endsWith("_min")).map(id=>{let best=null;for(const d of Object.keys(S.logs)){const r=(S.logs[d].sets||{})[id];if(!r)continue;for(const s of r){if(!s||!s.ok)continue;const sc=(+s.kg||0)*100+(+s.r||0);if(!best||sc>best.sc)best={sc,kg:+s.kg||0,r:+s.r||0,d}}}return best?{id,...best}:null}).filter(Boolean);
  return `<div class="stack" style="gap:16px">
  <section class="card"><span class="label">Registrar peso (mañana, en ayunas, después del baño)</span>
    <div class="row"><input type="date" id="wDate" value="${today()}" style="max-width:180px"><input type="number" step="0.1" inputmode="decimal" id="wIn2" placeholder="kg" style="max-width:120px"><button class="btn primary" id="wSave2">Guardar</button></div>
    ${weightChart(pts)}
    ${ws.length?`<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Peso</th><th></th></tr></thead><tbody>${ws.slice().reverse().slice(0,8).map(k=>`<tr><td>${fmtDate(k)}</td><td class="num mono">${S.weights[k].kg} kg</td><td><button class="btn ghost small" data-delw="${k}">Borrar</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="small muted">Pésate 1–3 veces por semana a la misma hora; mira la tendencia, no el número de un día.</p>`}
  </section>
  <section class="card"><span class="label">Totales</span>
    <div class="grid2"><div class="stat"><span class="label">Sesiones hechas</span><b class="num">${done}</b></div><div class="stat"><span class="label">Mejor racha</span><b class="num">${Math.max(S.profile.bestStreak||0,streak())}</b></div><div class="stat"><span class="label">Semanas en el plan</span><b class="num">${weeksIn()}</b></div><div class="stat"><span class="label">Fase</span><b class="num">${phase().p}</b><span class="small muted">${esc(phase().label)}</span></div></div></section>
  ${medalsCard()}
  ${testCard()}
  ${photoCard()}
  <section class="card"><span class="label">Tus mejores marcas</span>
    ${prs.length?`<div class="tbl-wrap"><table><thead><tr><th>Ejercicio</th><th>Mejor serie</th><th>Fecha</th></tr></thead><tbody>${prs.map(p=>`<tr><td>${esc(EX[p.id].n)}</td><td class="num mono">${p.r}${EX[p.id].u==="s"?" s":" reps"}${p.kg?" × "+p.kg+" kg":""}</td><td>${fmtDate(p.d)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="small muted">Tus récords aparecerán aquí después de tu primera sesión.</p>`}
  </section>
  ${partnerCard()}
  <section class="card"><span class="label">Historial</span>
    ${Object.keys(S.logs).length?`<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Sesión</th><th>Lumbar</th><th>Esfuerzo</th></tr></thead><tbody>${Object.keys(S.logs).sort().reverse().slice(0,20).map(d=>{const l=S.logs[d];return `<tr><td>${fmtDate(d)}</td><td>${l.skipped?'<span class="tag bad">Fallada</span>':l.done?esc(SESSIONS[l.type]?.name||l.type):'<span class="tag">A medias</span>'}</td><td class="num mono">${l.pain??"–"}</td><td class="num mono">${l.rpe??"–"}</td></tr>`}).join("")}</tbody></table></div>`:`<p class="small muted">Sin sesiones todavía. La primera es la más importante.</p>`}
  </section>
  ${backupCard()}</div>`;
}
function weightChart(pts){
  if(pts.length<2) return "";
  const W=600,H=200,L=40,R=10,T=12,B=26;
  const xs=pts.map(p=>parse(p.d).getTime()),ys=pts.map(p=>p.kg);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.floor(Math.min(...ys)-1),y1=Math.ceil(Math.max(...ys)+1);
  const X=t=>L+(W-L-R)*((t-x0)/((x1-x0)||1)),Y=v=>T+(H-T-B)*(1-(v-y0)/((y1-y0)||1));
  const step=Math.max(1,Math.ceil((y1-y0)/4));let grid="";
  for(let v=y0;v<=y1;v+=step)grid+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${v}</text>`;
  const line=pts.map((p,i)=>`${i?"L":"M"}${X(xs[i]).toFixed(1)},${Y(p.kg).toFixed(1)}`).join(" ");
  const area=line+` L${X(xs[xs.length-1]).toFixed(1)},${H-B} L${X(xs[0]).toFixed(1)},${H-B} Z`;
  const last=pts.length-1;
  return `<div class="tbl-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución del peso">${grid}
  <path d="${area}" fill="var(--accent-soft)" stroke="none"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <circle cx="${X(xs[last])}" cy="${Y(ys[last])}" r="5" fill="var(--accent)"/>
  <text x="${L}" y="${H-8}">${fmtDate(pts[0].d)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${fmtDate(pts[last].d)}</text></svg></div>`;
}

/* ============ EVENTOS ============ */
let rest=null;
function startRest(sec=90,label){clearInterval(rest);let t=sec;$("#restLbl").textContent=label||"Descanso";$("#restbar").hidden=false;$("#restT").textContent=t;rest=setInterval(()=>{t--;$("#restT").textContent=t;if(t<=0){clearInterval(rest);$("#restbar").hidden=true;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(_){}}},1000)}
$("#restSkip").onclick=()=>{clearInterval(rest);$("#restbar").hidden=true};

function curLog(){const {date,type,makeupFor}=ACTIVE;const l=JSON.parse(JSON.stringify(S.logs[date]||{}));l.date=date;l.type=l.done&&l.type!==type?l.type:type;if(makeupFor)l.makeupFor=makeupFor;l.sets=l.sets||{};return l}
function bindPane(){
  const P=$("#pane");
  P.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{ACTIVE={date:today(),type:b.dataset.start,makeupFor:b.dataset.makeup||null};const l=S.logs[today()];if(l&&l.done&&l.type)ACTIVE.type=l.type===b.dataset.start?l.type:b.dataset.start;render(true);scrollTo(0,0)});
  const so=$("#skipOpen",P); if(so) so.onclick=()=>{$("#skipBox").hidden=false;so.hidden=true};
  const sr=$("#skipReason",P); if(sr) sr.oninput=()=>{$("#skipConfirm").disabled=sr.value.trim().length<25};
  const sc=$("#skipConfirm",P); if(sc) sc.onclick=()=>{put("logs",today(),{date:today(),type:SCHEDULE[new Date().getDay()],skipped:true,reason:sr.value.trim(),ts:Date.now()});toast("Registrado. Mañana no se falla.")};
  const cs=$("#cSign",P); if(cs) cs.onclick=()=>{const why=$("#cWhy").value.trim();if(why.length<10){toast("Escribe tu porqué (al menos una frase).");return}put("app","profile",{why,penalty:$("#cPen").value.trim(),signedAt:Date.now(),startDate:S.profile.startDate||today()});toast("Contrato firmado. A entrenar.")};
  P.querySelectorAll("[data-mob]").forEach(c=>c.onchange=()=>{const t=today();const d=JSON.parse(JSON.stringify(S.days[t]||{h:{}}));d.mob=d.mob||[];const i=+c.dataset.mob;while(d.mob.length<=i)d.mob.push(false);d.mob[i]=c.checked;put("days",t,d)});
  P.querySelectorAll("[data-timer]").forEach(b=>b.onclick=()=>startRest(+b.dataset.timer,b.dataset.label));
  mountAnims(P);
  P.querySelectorAll("details").forEach(d=>d.addEventListener("toggle",()=>{if(d.open)mountAnims(d)}));
  P.querySelectorAll("[data-habit]").forEach(c=>c.onchange=()=>{const t=today();const d=JSON.parse(JSON.stringify(S.days[t]||{h:{}}));d.h=d.h||{};d.h[c.dataset.habit]=c.checked;put("days",t,d)});
  const saveW=(dateEl,inEl)=>{const v=parseFloat(String(inEl.value).replace(",","."));if(!(v>30&&v<300)){toast("Escribe un peso válido en kg.");return}put("weights",dateEl?dateEl.value:today(),{kg:Math.round(v*10)/10,ts:Date.now()});toast("Peso guardado.")};
  const w1=$("#wSave",P); if(w1) w1.onclick=()=>saveW(null,$("#wIn"));
  const w2=$("#wSave2",P); if(w2) w2.onclick=()=>saveW($("#wDate"),$("#wIn2"));
  P.querySelectorAll("[data-delw]").forEach(b=>b.onclick=()=>{if(b.dataset.armed){del("weights",b.dataset.delw)}else{b.dataset.armed=1;b.textContent="¿Seguro?"}});
  const ps=$("#pSave",P); if(ps) ps.onclick=()=>{const t=$("#pT").value.trim();if(!/^\d{2}:\d{2}$/.test(t)){toast("La hora va como 07:00");return}put("app","profile",{age:+$("#pAge").value||30,height:+$("#pH").value||173,startWeight:+$("#pW").value||104,trainTime:t,capPair:+$("#pCapP").value||9.25,capOne:+$("#pCap1").value||16.5});toast("Ajustes guardados.")};
  // sesión
  if(ACTIVE&&$("#closeSess",P)){
    $("#closeSess").onclick=()=>{ACTIVE=null;render(true)};
    P.querySelectorAll("input[data-ex]").forEach(inp=>inp.onchange=()=>{const l=curLog();const id=inp.dataset.ex,i=+inp.dataset.i;l.sets[id]=l.sets[id]||[];while(l.sets[id].length<=i)l.sets[id].push(null);l.sets[id][i]={...(l.sets[id][i]||{}),[inp.dataset.f]:inp.value===""?null:+inp.value};put("logs",ACTIVE.date,l,true)});
    P.querySelectorAll("[data-tick]").forEach(b=>b.onclick=()=>{const l=curLog();const id=b.dataset.tick,i=+b.dataset.i,e=EX[id];l.sets[id]=l.sets[id]||[];while(l.sets[id].length<=i)l.sets[id].push(null);
      const row=b.closest(".set");const r=row.querySelector('[data-f="r"]').value,kg=row.querySelector('[data-f="kg"]');const cur=l.sets[id][i]||{};
      const on=!cur.ok; l.sets[id][i]={r:r===""?(on?e.lo:null):+r,kg:kg?(kg.value===""?null:+kg.value):null,ok:on};put("logs",ACTIVE.date,l);render(true);if(on)startRest(e.u==="s"?45:90)});
    P.querySelectorAll("[data-wu],[data-cd]").forEach(c=>c.onchange=()=>{const l=curLog();const k=c.dataset.wu!==undefined?"wu":"cd";const i=+(c.dataset.wu??c.dataset.cd);l[k]=l[k]||[];while(l[k].length<=i)l[k].push(false);l[k][i]=c.checked;put("logs",ACTIVE.date,l)});
    const pain=$("#pain"),rpe=$("#rpe");pain.oninput=()=>$("#painV").textContent=pain.value;rpe.oninput=()=>$("#rpeV").textContent=rpe.value;
    $("#finish").onclick=()=>{const l=curLog();l.pain=+pain.value;l.rpe=+rpe.value;l.note=$("#note").value.trim();l.done=true;l.skipped=false;delete l.reason;l.ts=Date.now();
      const nSets=Object.values(l.sets).flat().filter(s=>s&&s.ok).length;if(nSets<3){toast("Marca al menos algunas series antes de terminar.");return}
      if(!S.profile.startDate)put("app","profile",{startDate:today()});
      put("logs",ACTIVE.date,l);ACTIVE=null;render(true);scrollTo(0,0);toast(`¡Hecho! Racha: ${streak()}. ${l.pain>3?"Ojo con la espalda: cuéntale al Coach.":"Así se construye."}`)};
  }
  // coach
  const f=$("#askF",P); if(f) f.onsubmit=e=>{e.preventDefault();const v=$("#askIn").value;$("#askIn").value="";ask(v)};
  P.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>ask(b.dataset.q));
  bindExtras(P);
}
